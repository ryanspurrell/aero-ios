name: Aero iOS

# Started by hand only. Never on push or on a schedule.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Also sign and upload a build to TestFlight (needs the three App Store Connect secrets)"
        type: boolean
        default: false

# macOS 15 image with Xcode 26.2 chosen by path, so a change to the image's
# default Xcode does not change this build. The label macos-15 itself moves
# to newer image versions over time; it is not a fixed image version.
env:
  XCODE_PATH: /Applications/Xcode_26.2.app
  # Repository variables, with neutral defaults.
  AERO_NAME: ${{ vars.AERO_PRODUCT_NAME || 'Aero' }}
  AERO_BUNDLE_ID: ${{ vars.AERO_BUNDLE_ID || 'com.example.aero' }}

jobs:
  check:
    # Proves the Swift compiles for the iOS Simulator. No Apple account needed.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Note start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch embeddable CPython for iOS and the pure-Python packages
        run: sh tools/prepare_python.sh
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build for the iOS Simulator, signing off
        run: |
          settings=(PRODUCT_NAME="$AERO_NAME" PRODUCT_BUNDLE_IDENTIFIER="$AERO_BUNDLE_ID")
          xcodebuild build \
            -project Aero.xcodeproj -scheme Aero -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            "${settings[@]}"
      - name: Pick an iPhone simulator
        run: |
          set -eu
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone") and "Pro" not in d["name"] and "Air" not in d["name"]:
                          print(d["udid"]); raise SystemExit
          ')"
          test -n "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run the unit tests in the iOS Simulator
        run: |
          set -o pipefail
          # the names are not overridden here: the test target's own bundle identifier is built on the app's
          xcodebuild test \
            -project Aero.xcodeproj -scheme Aero -configuration Debug \
            -sdk iphonesimulator -destination "id=$SIM_UDID" -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-output.txt | tail -n 120
      - name: Show each failed test and why
        if: failure()
        run: grep -E "error: -\[|' failed \(" test-output.txt || echo "no failed test lines found"
      - name: Print how long this job took
        if: always()
        run: echo "check job took $(( $(date +%s) - STARTED_AT )) seconds"

  gate:
    # Decides whether the upload may run. Secrets cannot be tested in a
    # job-level condition, so they are tested here and the answer passed on.
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.test.outputs.ready }}
    steps:
      - id: test
        env:
          WANT: ${{ inputs.upload }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ "$WANT" = "true" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY_P8" ] && [ -n "$TEAM" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Upload skipped: it was not asked for, or a secret (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) or the variable APPLE_TEAM_ID is missing."
          fi

  testflight:
    needs: [check, gate]
    if: needs.gate.outputs.ready == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Note start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch embeddable CPython for iOS and the pure-Python packages
        run: sh tools/prepare_python.sh
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/asc-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$ASC_KEY_P8" > "$key_file"

          settings=(PRODUCT_NAME="$AERO_NAME" PRODUCT_BUNDLE_IDENTIFIER="$AERO_BUNDLE_ID"
                    CURRENT_PROJECT_VERSION="$RUN_NUMBER" DEVELOPMENT_TEAM="$TEAM_ID")
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key_file"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST

          xcodebuild archive \
            -project Aero.xcodeproj -scheme Aero -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Aero.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            "${settings[@]}"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Aero.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${auth[@]}"
      - name: Print how long this job took
        if: always()
        run: echo "testflight job took $(( $(date +%s) - STARTED_AT )) seconds"
