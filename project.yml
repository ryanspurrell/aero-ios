# XcodeGen spec for the Aero iPhone app. Step 1: the shell only.
# Generate the Xcode project with `xcodegen generate` (see README.md).
name: Aero

options:
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true

settings:
  base:
    # Placeholders. The workflow overrides these on the xcodebuild command
    # line from repository variables and secrets (see README.md). The bundle
    # identifier cannot change after the first upload to App Store Connect.
    PRODUCT_NAME: Aero
    PRODUCT_BUNDLE_IDENTIFIER: com.example.aero
    # What the address field starts with on first launch. Empty by default.
    # The address itself is entered in the app and kept on the phone.
    AERO_DEFAULT_ADDRESS: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Signing is automatic. No team is written here: the check job turns
    # signing off, and the upload job passes the team on the command line.
    CODE_SIGN_STYLE: Automatic

# MapLibre Native for iOS (BSD-2-Clause), as a binary Swift package: draws the Location map. Its licence is at
# https://github.com/maplibre/maplibre-native/blob/main/LICENSE.md ; the version is fixed, not "latest".
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0

targets:
  Aero:
    type: application
    platform: iOS
    sources:
      - path: Aero
    info:
      path: Aero/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        AeroDefaultAddress: "$(AERO_DEFAULT_ADDRESS)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - exo2.ttf
        NSCameraUsageDescription: "Aero uses the camera for video calls and for photos you take in Aero."
        NSMicrophoneUsageDescription: "Aero uses the microphone for calls, voice messages and dictation."
        NSPhotoLibraryUsageDescription: "Aero lets you pick photos and videos from your library to send or save."
        NSPhotoLibraryAddUsageDescription: "Aero saves photos and videos you choose to your library."
        # Only standard HTTPS is used, so no export paperwork is asked for.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Aero/Aero-Bridging-Header.h
        # iPhone only, set on the target too: XcodeGen's target defaults made the
        # build universal, and Apple then asked for iPad icons and orientations.
        TARGETED_DEVICE_FAMILY: "1"
        # The build script below copies the Python standard library and the reader into the app after it is built.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ENABLE_BITCODE: "NO"
    dependencies:
      - package: MapLibre
        product: MapLibre
      # CPython for iOS (PEP 730), fetched by tools/prepare_python.sh before the project is generated.
      - framework: Python.xcframework
        embed: true
        codeSign: true
    postbuildScripts:
      - name: Install Python standard library, packages and the reader
        basedOnDependencyAnalysis: false
        script: |
          set -e
          : "${EXPANDED_CODE_SIGN_IDENTITY:=-}"
          export EXPANDED_CODE_SIGN_IDENTITY
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          mkdir -p "$CODESIGNING_FOLDER_PATH/app_packages" "$CODESIGNING_FOLDER_PATH/reader"
          rsync -a --delete --exclude '__pycache__' "$PROJECT_DIR/app_packages/" "$CODESIGNING_FOLDER_PATH/app_packages/"
          rsync -a --delete --exclude '__pycache__' --exclude 'SOURCES.txt' --exclude 'stdlib_keep.txt' "$PROJECT_DIR/reader/" "$CODESIGNING_FOLDER_PATH/reader/"
          install_python Python.xcframework app_packages
          # keep only the standard library files the reader imports (reader/stdlib_keep.txt, measured by the build's simulator run)
          python3 "$PROJECT_DIR/tools/trim_stdlib.py" "$CODESIGNING_FOLDER_PATH/python/lib/python3.13" "$PROJECT_DIR/reader/stdlib_keep.txt"
    scheme:
      testTargets:
        - AeroTests

  AeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AeroTests
        excludes:
          - "Fixtures/**"
      # the same invented record files the Python tests read, copied in by tools/stage_for_aero_ios.py
      - path: AeroTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Aero
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aero.tests
        PRODUCT_NAME: AeroTests

  # Field: a separate app (iPhone and iPad) for air-sampling field work. It displays one board and keeps every record on the device. It has no
  # network code and asks for no location. The rules are in Field/Model and mirror FieldSample.lean. It shares only Aero's look, by path.
  Field:
    type: application
    platform: iOS
    sources:
      - path: Field
      # Aero's tokens and bubble look, shared by path (not copied): the same files Aero compiles.
      - path: Aero/Native/Tokens.swift
      - path: Aero/Native/FingusUI.swift
      - path: Aero/Resources/Fonts/exo2.ttf
      # The app icon is Aero's Fingus head, shared by path, as a placeholder until Aryn picks Field's own (2026-10-23).
      - path: Aero/Assets.xcassets
    info:
      path: Field/Info.plist
      properties:
        CFBundleDisplayName: "$(FIELD_DISPLAY_NAME)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - exo2.ttf
        # No camera, microphone, photo, location or network use: no usage text is asked for because none is used.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Field
        FIELD_DISPLAY_NAME: Field
        # Registered by Aryn on 2026-10-23 with its App Store Connect entry. It cannot change after a first upload.
        PRODUCT_BUNDLE_IDENTIFIER: ca.fingus.field
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - FieldTests

  FieldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FieldTests
    dependencies:
      - target: Field
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ca.fingus.field.tests
        PRODUCT_NAME: FieldTests
